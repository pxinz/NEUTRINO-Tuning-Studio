name: macOS build

# Native macOS packaging is the reliable way to produce a Mac build.
# This workflow intentionally produces an unsigned artifact; for distribution,
# add Apple Developer ID signing + notarization secrets.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package macOS arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neutrino-tuning-studio-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
